name: burst-safe-inventory
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - inventory-data:/var/lib/postgresql/data

  safe:
    build: .
    environment: &app-env
      DB_URL: jdbc:postgresql://db:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: inventory
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-2000}
      INVENTORY_MODE: safe
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 3s
      timeout: 2s
      retries: 30

  safe-replica:
    build: .
    profiles: ["replicas"]
    environment:
      <<: *app-env
      SERVER_PORT: 8080
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

  naive:
    build: .
    profiles: ["naive"]
    environment:
      <<: *app-env
      INVENTORY_MODE: naive
      ALLOW_UNSAFE_MODE: "true"
      NAIVE_DELAY_MS: ${NAIVE_DELAY_MS:-0}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  inventory-data:
