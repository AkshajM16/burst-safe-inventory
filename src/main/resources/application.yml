spring:
  application:
    name: burst-safe-inventory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: 1000
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${HTTP_MAX_THREADS:200}
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT:3s}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
inventory:
  mode: ${INVENTORY_MODE:safe}
  allow-unsafe: ${ALLOW_UNSAFE_MODE:false}
  naive-delay-ms: ${NAIVE_DELAY_MS:0}
