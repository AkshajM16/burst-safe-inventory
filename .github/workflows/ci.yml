name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate scripts and Compose
        run: |
          python3 -m py_compile stress/stress.py stress/compare.py stress/plot.py
          sh -n scripts/wait-ready.sh scripts/failure-scenarios.sh
          docker compose config --quiet

      - name: Run unit and integration tests
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/inventory
        run: mvn --batch-mode --no-transfer-progress verify
