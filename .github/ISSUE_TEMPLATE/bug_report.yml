name: Bug report
description: Report a reproducible correctness, API, tooling, or documentation defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not use public issues for security vulnerabilities; follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [safe, naive, both, tooling/documentation]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, concurrency, inventory, and request count.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, architecture, and relevant non-secret configuration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include invariant output, error response, logs, or a minimal result excerpt. Remove secrets.
